name: Build Windows installer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install pyinstaller==5.13.2

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --name RecoveryHDD --paths app app\main.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\RecoveryHDD.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoveryHDD-Setup
          path: Output/RecoveryHDD_Setup.exe
          if-no-files-found: error
